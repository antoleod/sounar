# Sounar's built-in presets. Each one sets how the speakers share the music (layout), the
# values of that layout, and the Easy Effects preset loaded with it, in one go: `sounar <id>`.
# Order here = order in menus and for `sounar next`. Don't edit this file: add or override
# presets in ~/.config/sounar/presets.toml (same format; `hidden = true` hides one).
#
# layout = "room"    at your seat: vocals anchored in the speaker you face, ambience from the
#                    speakers beside and behind you, the same lined-up bass from all of them
#   centre  dB   how much quieter the vocals are in the other front speakers than in the one you face
#   fill    dB   ambience level as heard at the seat, relative to the front
#   haas    ms   how much later the ambience arrives than the front (10-20 ms: room, not echo)
#   vocal   dB   centre-only presence lift (vocals pop through the ambience)
#   bass    dB   bass of the speakers that may be boosted, against stereo (0 = the same)
#   xover   Hz   below this every speaker plays the same mono bass, time-aligned (default 150)
#   amb_lo / amb_hi  Hz  ambience band (defaults 250 / 11000)
#   dip     dB   ambience cut around 2.5 kHz (1.2-5 kHz) so vocal reverb doesn't come from behind
# layout = "stereo"  every speaker plays as wired: only sync and balance
# layout = "spread"  anywhere in the room: every speaker plays the whole song
#   width   0-1  how much stereo is kept (0 = mono everywhere, 1 = full stereo)
#
# ee = the Easy Effects preset loaded with it. Loudness leveling (Autogain) is on in all the
# shipped ones, and Sounar raises or lowers its target per preset so switching doesn't change
# loudness. Values a setup can't use (no rear speaker = no fill) are simply ignored.

[music-room]
label = "Music Room"
tagline = "Vocals up front, full bass, the room filled around you"
icon = "󰝚"
layout = "room"
centre = 6
fill = -9
haas = 12
vocal = 1.0
bass = 1.0
dip = -5
ee = "Sounar Room"

[vocal]
label = "Vocal Focus"
tagline = "Singers, acoustic, podcasts: the voice right in front of you"
icon = "󰍬"
layout = "room"
centre = 9
fill = -13
haas = 10
vocal = 2.0
bass = 0
dip = -7
ee = "Sounar Room"

[immersive]
label = "Immersive"
tagline = "Ambient, live sets, film scores: a bigger room"
icon = "󰗅"
layout = "room"
centre = 5
fill = -6
haas = 16
vocal = 1.0
bass = 1.0
amb_lo = 200
dip = -4
ee = "Sounar Room"

[club]
label = "Club"
tagline = "Afrobeats, amapiano, hip-hop, EDM: deep, punchy bass"
icon = "󰓃"
layout = "room"
centre = 6
fill = -10
haas = 12
vocal = 1.0
bass = 3.0
xover = 160
dip = -5
ee = "Sounar Room"

[concert]
label = "Concert Hall"
tagline = "Classical and jazz: a wide stage and hall air"
icon = "󰙽"
layout = "room"
centre = 3
fill = -6
haas = 20
vocal = 0.5
bass = 0
amb_lo = 200
amb_hi = 12000
dip = -3
ee = "Sounar Classical Room"

[late-night]
label = "Late Night"
tagline = "Low volume: clear vocals, even loudness, no boom"
icon = "󰖔"
layout = "room"
centre = 6
fill = -12
haas = 12
vocal = 1.5
bass = 0
dip = -5
ee = "Sounar Late Night"

[tv]
label = "TV"
tagline = "Facing the TV: every speaker plays full stereo, as wired"
icon = "󰔂"
layout = "stereo"
ee = "Sounar Default"

[movie]
label = "Movie Night"
tagline = "Facing the TV: dialogue up front, loud scenes tamed"
icon = "󰿎"
layout = "stereo"
ee = "Sounar Movie Night"

[party]
label = "Party"
tagline = "Anywhere in the room: every speaker plays the whole song"
icon = "󰍖"
layout = "spread"
width = 0.5
ee = "Sounar Default"
