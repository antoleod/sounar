[project]
name = "sounar"
version = "0.1.0"
description = "Arrange several speakers into one system: layout, balance, delay and effects as one preset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# E702/E703: the graph code chains short statements on one line, as the original did.
ignore = ["E702", "E703", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
