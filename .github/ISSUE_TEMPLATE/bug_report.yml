name: Bug report
description: Something doesn't work or sounds wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you heard or saw instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: sounar doctor
      description: Paste the output of `sounar doctor`. It leaves out device addresses, device names and your home folder.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Error messages, which preset was active, whether a speaker had just reconnected...
